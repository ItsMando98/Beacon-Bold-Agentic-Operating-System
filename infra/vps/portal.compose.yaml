# Optional, independent customer-portal deployment. Not part of the existing receiver.
name: roaswell-portal
services:
  portal:
    image: beacon-bold-portal:${BEACON_RELEASE:?}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [proxy]
    environment:
      APP_ENV: ${PORTAL_APP_ENV:-staging}
      SERVICE_MODE: live
      AUTH_ENABLED: "true"
      PUBLIC_API_URL: ${PUBLIC_API_URL:?}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:?}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?}
      PORTAL_AUTH0_CLIENT_ID: ${PORTAL_AUTH0_CLIENT_ID:?}
      PORTAL_BASE_URL: https://${PORTAL_HOST:?}
      PORTAL_AUTH0_CLIENT_SECRET_FILE: /run/secrets/portal_client_secret
      PORTAL_AUTH0_SECRET_FILE: /run/secrets/portal_session_secret
    secrets: [portal_client_secret, portal_session_secret]
    healthcheck:
      test: [CMD, node, "-e", "fetch('http://127.0.0.1:3003').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.roaswell-portal.rule: Host(`${PORTAL_HOST:?}`)
      traefik.http.routers.roaswell-portal.entrypoints: https
      traefik.http.routers.roaswell-portal.tls: "true"
      traefik.http.routers.roaswell-portal.tls.certresolver: letsencrypt
      traefik.http.services.roaswell-portal.loadbalancer.server.port: "3003"
networks:
  proxy: {external: true, name: coolify}
secrets:
  portal_client_secret: {file: "${PORTAL_SECRETS_DIR:?}/portal_client_secret"}
  portal_session_secret: {file: "${PORTAL_SECRETS_DIR:?}/portal_session_secret"}
